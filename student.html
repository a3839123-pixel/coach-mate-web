<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3F5F9">
<meta http-equiv="Cache-Control" content="no-store">
<title>泰勒教練｜學員專區</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#16213a;background:#f3f5f9;font-size:16px;color-scheme:light}
*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button{cursor:pointer;border:1px solid #cbd3e0;background:#fff;color:#16213a;border-radius:12px;padding:12px 18px;min-height:46px}button:disabled{opacity:.5;cursor:default}.primary{background:#f5ba00;border-color:#f5ba00;font-weight:700}.line{background:#06c755;color:#fff;border:0;font-weight:700}.muted,small{color:#66738b}.wrap{max-width:780px;margin:auto;padding:24px 16px max(28px,env(safe-area-inset-bottom))}.brand{font-size:14px;font-weight:700;letter-spacing:.08em;color:#283f87}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:0 0 16px}h3{font-size:17px;margin:0}.card{background:white;border:1px solid #e4e8ef;border-radius:20px;padding:22px;margin-top:18px}.gate{margin-top:36px;padding:30px 24px}.gate p{line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stat{background:#edf1f8;border-radius:14px;padding:18px 14px}.stat strong{display:block;font-size:30px;margin:6px 0}.badge{display:inline-block;color:#283f87;background:#edf1f8;border-radius:8px;padding:5px 8px;font-size:13px}.lesson{border-top:1px solid #e4e8ef;padding:16px 0}.lesson:first-of-type{border-top:0}.lesson:last-child{padding-bottom:0}.slot{margin:8px 0 12px;color:#66738b}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}th,td{padding:12px 5px;border-bottom:1px solid #e4e8ef;text-align:center;overflow-wrap:anywhere}th{color:#66738b;font-size:13px}th:first-child,td:first-child{text-align:left;width:43%}th:nth-child(2){width:25%}td:nth-child(2){font-variant-numeric:tabular-nums}td:last-child,td:nth-last-child(2){width:16%}.empty{color:#66738b;font-size:14px;margin:12px 0;line-height:1.7}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.pager button{padding:10px}.notice{line-height:1.7;font-size:14px}.foot{font-size:12px;color:#66738b;text-align:center;margin:24px 0}#status{font-size:14px;line-height:1.7;margin:14px 0;min-height:24px}a{color:#283f87}input{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd3e0}button:focus-visible,a:focus-visible{outline:3px solid #839bd7;outline-offset:3px}@media(max-width:360px){.wrap{padding:18px 12px}.card{padding:18px 14px}td,th{padding:10px 3px;font-size:14px}.stat strong{font-size:26px}}
.exercise-name{display:flex;align-items:center;gap:7px;min-width:0}.exercise-name>span:last-child{min-width:0;overflow-wrap:anywhere}.exercise-icon{display:block;flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:#edf1f8;color:#283f87;padding:3px}.exercise-icon svg{display:block;width:100%;height:100%}@media(max-width:360px){.exercise-icon{flex-basis:30px;width:30px;height:30px;padding:2px}.exercise-name{gap:5px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">泰勒 Taylor 教練</div>
  <div class="head"><h1>學員專區</h1><button id="refresh" hidden>重新整理</button></div>
  <p class="muted">你的課程與每一次進步，都在這裡。</p>
  <div id="status" role="status" aria-live="polite">正在連接 LINE 登入服務…</div>
  <div id="content"></div>
  <p class="foot">本頁提供個人紀錄查詢。排課或資料問題，請聯絡泰勒教練。</p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
'use strict';
const LIFF_ID='2012198067-LSaer2eJ';
const API='https://mjkqnjfqhsnugwjgflwx.supabase.co/functions/v1/line-student-api';
const PUBLIC_KEY='sb_publishable_To2DKUsx0-fDjCHGqMivUQ_kLH5QXHq';
const INVITE_KEY='coach-portal-invite-v1';
const content=document.querySelector('#content'),status=document.querySelector('#status'),refresh=document.querySelector('#refresh');
let invite='',currentPage=0,ticket=0,ready=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function captureInvite(){
  const params=new URLSearchParams(location.search);
  const nested=new URLSearchParams((params.get('liff.state')||'').replace(/^\?/,''));
  const candidate=params.get('invite')||nested.get('invite');
  try{
    if(candidate&&/^[a-f0-9]{64}$/.test(candidate))sessionStorage.setItem(INVITE_KEY,candidate);
    invite=sessionStorage.getItem(INVITE_KEY)||'';
  }catch{if(candidate&&/^[a-f0-9]{64}$/.test(candidate))invite=candidate;}
}
function clearInvite(){invite='';try{sessionStorage.removeItem(INVITE_KEY);}catch{}history.replaceState(null,'',location.pathname);}
function gate(title,message,button,handler){
  refresh.hidden=true;
  content.innerHTML=`<section class="card gate"><h2>${esc(title)}</h2><p>${esc(message)}</p>${button?`<button class="line" id="gate-action">${esc(button)}</button>`:''}</section>`;
  if(button)content.querySelector('#gate-action').onclick=handler;
}
function login(){
  const redirect=new URL(location.pathname,location.origin);
  if(invite)redirect.searchParams.set('invite',invite);
  if(liff.isLoggedIn())liff.logout();
  liff.login({redirectUri:redirect.href});
}
function errorGate(code){
  const messages={PORTAL_UNBOUND:['尚未綁定學員資料','請向教練索取你的專屬邀請連結，再從該連結登入。'],
    PORTAL_INVALID_INVITE:['邀請連結無法使用','連結可能已過期、使用過或被取消，請教練重新產生邀請連結。'],
    PORTAL_ALREADY_BOUND:['這個 LINE 已綁定其他學員','如需更換綁定，請先聯絡教練解除原本的綁定。'],
    PORTAL_LOGIN_REQUIRED:['請重新登入 LINE','登入已逾時或尚未完成授權，請重新登入。'],
    PORTAL_SERVER_ERROR:['暫時無法取得紀錄','服務可能尚未啟用或網路暫時中斷，請稍後重試，或聯絡教練。']};
  const [title,message]=messages[code]||messages.PORTAL_SERVER_ERROR;
  if(code==='PORTAL_UNBOUND'&&invite){
    gate('連結你的學員資料','請確認這是教練專門傳給你的邀請連結。綁定後，這個 LINE 帳號將能查詢對應學員的紀錄。請勿轉傳連結。','確認綁定我的資料',()=>load('claim'));
  }else if(code==='PORTAL_LOGIN_REQUIRED')gate(title,message,'重新登入',login);
  else gate(title,message,'重新整理',()=>load());
}
// 學員端的內嵌向量小圖：不下載圖檔、不更動教練輸入或訓練資料。
// 以已知名稱對應動作示意；未知／自訂動作保留純文字，避免硬套錯誤圖案。
const EXERCISE_PICTOGRAMS={
  squat:{head:[32,10],body:'M30 19L23 34L42 37L36 54L47 54M29 22L47 24',equipment:''},
  lunge:{head:[30,9],body:'M30 18L29 32L44 35L44 54L53 54M29 32L18 43L11 51L20 51M29 21L39 28L46 25',equipment:''},
  hinge:{head:[43,15],body:'M38 21L21 32L28 44L24 54L34 54M33 25L38 43',equipment:'M29 45H49M30 40V50M48 40V50'},
  bridge:{head:[11,43],body:'M19 44L34 29L48 37L54 51M20 47L35 47',equipment:'M6 54H59'},
  legpress:{head:[14,18],body:'M17 26L24 40L37 36L46 23M23 40L30 49M20 30L29 32',equipment:'M7 27L17 48H33M45 16L54 25M50 21L59 8'},
  extension:{head:[24,10],body:'M24 19V35L40 35L51 25M25 23L34 29',equipment:'M14 39H36M17 39V54M33 39V54'},
  legcurl:{head:[24,10],body:'M24 19V35L42 35L34 48M24 22L33 28',equipment:'M14 39H40M17 39V54M36 39V54'},
  calf:{head:[31,9],body:'M31 18V35L28 48L38 48M31 35L39 47M31 23L43 23',equipment:'M22 53H46'},
  pulldown:{head:[31,22],body:'M31 31V43L45 44L45 54M31 32L19 24L17 13M31 32L43 24L45 13',equipment:'M14 10H49M22 46H39M25 46V56'},
  pullup:{head:[31,20],body:'M31 29V42L23 53M31 42L40 53M31 30L19 21L18 9M31 30L43 21L45 9',equipment:'M10 7H53'},
  row:{head:[34,12],body:'M29 20L20 34L29 45L24 54L34 54M29 23L41 28L38 39',equipment:'M31 44H48M32 40V48M47 40V48'},
  chestpress:{head:[14,34],body:'M23 36H42L49 49L55 49M29 35L29 17M39 35L39 17',equipment:'M9 41H44M14 41V54M40 41V54M23 14H46M24 10V18M45 10V18'},
  fly:{head:[32,10],body:'M32 19V38L24 54M32 38L41 54M31 23L17 28L9 20M33 23L47 28L55 20',equipment:'M6 16L12 24M52 16L58 24'},
  pushup:{head:[48,21],body:'M40 26L22 35L10 43L6 43M39 27L44 35L39 44L47 44',equipment:'M5 49H59'},
  press:{head:[32,22],body:'M32 31V42L24 55M32 42L41 55M31 32L18 23L18 10M33 32L46 23L46 10',equipment:'M11 8H24M40 8H53'},
  lateral:{head:[32,10],body:'M32 19V38L24 54M32 38L41 54M31 23L10 26M33 23L54 26',equipment:'M7 22V30M57 22V30'},
  curl:{head:[30,10],body:'M30 19V37L23 54M30 37L38 54M30 23L42 34L48 23',equipment:'M43 21H53M44 17V25M52 17V25'},
  triceps:{head:[27,10],body:'M27 19V37L20 54M27 37L36 54M27 23L41 25L41 40',equipment:'M39 5V22M36 43H48'},
  plank:{head:[48,27],body:'M40 32L24 36L11 44L6 44M40 33L44 44H54',equipment:'M5 50H59'},
  sideplank:{head:[43,18],body:'M38 25L24 38L12 48L7 48M36 27L44 46H52M35 27L24 15',equipment:'M5 53H59'},
  crunch:{head:[37,24],body:'M32 32L23 44L39 44L46 33L55 47M33 32L43 28',equipment:'M8 53H59'},
  deadbug:{head:[12,43],body:'M20 44H38L39 27L50 27M25 43L26 24M38 44L48 50',equipment:'M6 55H59'},
  birddog:{head:[49,25],body:'M41 29H26L18 29H7M27 30L28 48H39M39 30L48 32H58',equipment:'M6 54H59'},
  carry:{head:[32,9],body:'M32 18V35L22 53M32 35L43 51M31 22L20 36M33 22L45 36',equipment:'M15 41H25V49H15ZM40 41H50V49H40Z'},
  rotation:{head:[32,10],body:'M32 19V37L23 54M32 37L42 54M31 24L44 24L47 30',equipment:'M16 17Q7 25 15 33M10 32L16 34L17 28'},
  catcow:{head:[47,23],body:'M41 29Q31 18 22 30M24 29V49H32M40 29V49H48',equipment:'M10 54H58'}
};
function exercisePictogramKind(name){
  const n=String(name||'').trim().toLowerCase();
  const rules=[
    ['sideplank',/側平板|side\s*plank/],['birddog',/鳥狗|bird\s*dog/],['deadbug',/死蟲|dead\s*bug/],
    ['catcow',/貓牛|cat.?cow/],['legpress',/腿推|大腿推舉|leg\s*press/],['extension',/腿屈伸|leg\s*extension/],
    ['legcurl',/腿彎舉|leg\s*curl/],['calf',/提踵|calf\s*raise/],['bridge',/臀推|臀橋|橋式|hip\s*thrust|glute\s*bridge/],
    ['lunge',/弓箭步|分腿蹲|lunge|split\s*squat/],['squat',/深蹲|單腳蹲|squat/],['hinge',/硬舉|早安式|deadlift|good\s*morning/],
    ['pulldown',/下拉|pulldown/],['pullup',/引體向上|pull.?up|chin.?up/],['row',/划船|row/],
    ['pushup',/伏地挺身|push.?up/],['chestpress',/臥推|胸推|bench\s*press|chest\s*press/],['fly',/夾胸|^(?:上斜)?啞鈴飛鳥$|chest\s*fly/],
    ['press',/肩推|shoulder\s*press|overhead\s*press/],['lateral',/側平舉|lateral\s*raise/],
    ['curl',/二頭|錘式彎舉|集中彎舉|牧師椅彎舉|反向彎舉|bicep|hammer\s*curl/],
    ['triceps',/三頭|tricep/],['plank',/平板撐|plank/],['crunch',/捲腹|crunch/],['carry',/農夫走路|farmer/],['rotation',/脊椎旋轉|胸椎旋轉/]
  ];
  return rules.find(([,pattern])=>pattern.test(n))?.[0]||null;
}
function exercisePictogram(name){
  const kind=exercisePictogramKind(name),icon=EXERCISE_PICTOGRAMS[kind];
  if(!icon)return '';
  return `<span class="exercise-icon" data-exercise-icon="${kind}" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" focusable="false"><circle cx="${icon.head[0]}" cy="${icon.head[1]}" r="5.5" fill="currentColor"/><path d="${icon.body}" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>${icon.equipment?`<path d="${icon.equipment}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}</svg></span>`;
}
function exerciseTable(rows){
  if(!rows.length)return '<p class="empty">教練尚未填寫這堂訓練內容。</p>';
  return `<div class="table-wrap"><table><thead><tr><th>動作</th><th>重量</th><th>次數</th><th>組數</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="exercise-name">${exercisePictogram(x.name)}<span>${esc(x.name)}</span></span></td><td>${esc(x.weight===0?'徒手':x.weight+' '+x.unit)}</td><td>${esc(x.reps)}</td><td>${esc(x.sets)}</td></tr>`).join('')}</tbody></table></div>`;
}
function render(data){
  currentPage=data.page;
  content.innerHTML=`<section class="card"><h2>${esc(data.name)}，你好</h2>
    <div class="summary"><div class="stat">目前剩餘<strong>${esc(data.remaining)} <small>堂</small></strong></div><div class="stat">本期合約進度<strong>${esc(data.bought)}－${esc(data.used)}</strong><small>購買堂數－已上堂數</small></div></div></section>
    <section class="card"><h2>接下來的課程</h2>${data.upcoming.length?data.upcoming.map(l=>`<div class="lesson"><strong>${esc(l.date)}</strong><p class="slot">${esc(l.start)}–${esc(l.end)}</p><span class="badge">${esc(l.status)}</span></div>`).join(''):'<p class="empty">目前沒有接下來的預約。</p>'}</section>
    <section class="card"><h2>上課與訓練紀錄</h2>${data.history.length?data.history.map(l=>`<article class="lesson"><div class="head"><h3>${esc(l.date)}</h3><span class="badge">${esc(l.bought)}－${esc(l.used)}</span></div><p class="slot">${esc(l.start)}–${esc(l.end)} · ${esc(l.status)}</p>${exerciseTable(l.exercises)}</article>`).join(''):'<p class="empty">目前沒有過往上課紀錄。</p>'}
    ${data.pages>1?`<div class="pager"><button id="prev" ${data.page===0?'disabled':''}>較新的紀錄</button><small>${data.page+1} / ${data.pages}</small><button id="next" ${data.page>=data.pages-1?'disabled':''}>較早的紀錄</button></div>`:''}</section>
    <p class="notice muted">堂數與紀錄以教練同步的資料為準；若過往紀錄未完整補登，歷史合約進度可能有差異。</p><button id="logout">登出 LINE 學員專區</button>`;
  content.querySelector('#prev')?.addEventListener('click',()=>load('read',currentPage-1));
  content.querySelector('#next')?.addEventListener('click',()=>load('read',currentPage+1));
  content.querySelector('#logout').onclick=()=>{ticket++;liff.logout();clearInvite();status.textContent='已登出';gate('歡迎回來','用 LINE 登入，查看自己的上課與訓練紀錄。','用 LINE 登入',login);};
  refresh.hidden=false;status.textContent='已取得教練最新同步的紀錄';
}
async function load(action='read',page=0){
  if(!ready)return;
  const thisTicket=++ticket;content.innerHTML='';refresh.disabled=true;status.textContent=action==='claim'?'正在綁定…':'正在讀取你的紀錄…';
  try{
    const idToken=liff.getIDToken();if(!idToken){errorGate('PORTAL_LOGIN_REQUIRED');return;}
    const response=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','apikey':PUBLIC_KEY},
      body:JSON.stringify({action,idToken,page,...(action==='claim'?{invite}:{})}),signal:AbortSignal.timeout(20000)});
    const data=await response.json();if(thisTicket!==ticket)return;
    if(!response.ok){status.textContent='';errorGate(data.code);return;}
    clearInvite();render(data);
  }catch{if(thisTicket===ticket){status.textContent='';errorGate('PORTAL_SERVER_ERROR');}}
  finally{if(thisTicket===ticket)refresh.disabled=false;}
}
refresh.onclick=()=>load('read',currentPage);
async function init(){
  captureInvite();
  try{
    if(!window.liff)throw Error('SDK');
    await liff.init({liffId:LIFF_ID});captureInvite();ready=true;
    // init 必須先處理 LINE 回傳參數，之後才可清掉邀請碼，避免干擾登入導向。
    if(!new URLSearchParams(location.search).has('liff.state'))history.replaceState(null,'',location.pathname);
    if(!liff.isLoggedIn()){status.textContent='';gate('歡迎來到學員專區','用 LINE 登入，查看自己的課程、剩餘堂數與訓練內容。','用 LINE 登入',login);}
    else await load();
  }catch{status.textContent='';gate('LINE 登入服務暫時無法載入','請確認網路，並從教練提供的 LINE 連結重新開啟。','重試',()=>location.reload());}
}
window.addEventListener('pageshow',e=>{if(e.persisted&&ready)load('read',currentPage);});
init();
</script>
</body>
</html>
